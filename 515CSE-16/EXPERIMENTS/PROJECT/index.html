<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigBasket Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">bigbasket</div>

        <div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="Search products..."
    >
    <button onclick="searchProduct()">
        Search
    </button>
</div>

        <div class="cart">
    Cart: <span id="cart-count">0</span>
</div>
    </header>
<section class="banner">
        <h1>Fresh Groceries Delivered to Your Doorstep</h1>
    </section>

<section class="products">

    <div class="product-card">
        <img src="natural-fresh-apple-fruit-800.jpg" alt="Apple">
        <h3>Fresh Apples</h3>
        <p>₹120 / kg</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="images.jpeg" alt="Banana">
        <h3>Bananas</h3>
        <p>₹60 / dozen</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="e7395d48-2bb9-4193-ba85-479340c5a2bb_7109_3.avif" alt="Milk">
        <h3>Milk</h3>
        <p>₹55 / litre</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="istockphoto-153737841-612x612.jpg" alt="Rice">
        <h3>Rice</h3>
        <p>₹80 / kg</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="1_d3cd0ed5-d2fc-4350-beb7-80717d6018a9.webp" alt="Bread">
        <h3>Brown Bread</h3>
        <p>₹40 / pack</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="AdobeStock_248253485 copy.webp" alt="Eggs">
        <h3>Farm Fresh Eggs</h3>
        <p>₹75 / dozen</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="product-card">
    <img src="close-up-view-tomatoes-basket-plate-wooden-table_141793-10755.avif" alt="Tomato">
    <h3>Fresh Tomatoes</h3>
    <p>₹30 / kg</p>
    <button onclick="addToCart()">Add to Cart</button>
</div>

<div class="product-card">
    <img src="360_F_1284148744_rEv3jO5cPLiOYpEmCkedSkRxtVuYJ8uQ.jpg" alt="Potato">
    <h3>Potatoes</h3>
    <p>₹25 / kg</p>
    <button onclick="addToCart()">Add to Cart</button>
</div>


</section>
<footer>
    © 2026 BigBasket Clone | Developed by B.Tech Student
</footer>
